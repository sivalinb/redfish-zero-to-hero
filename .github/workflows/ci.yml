name: Learning app checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: python -m scripts.evaluate_tutor --check
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8521/_stcore/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8521/_stcore/health
      - run: docker compose exec -T app python -m scripts.verify_stack --service-url http://simulator:8631 --prometheus-url http://prometheus:9090
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
