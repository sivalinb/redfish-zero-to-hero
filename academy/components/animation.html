<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#213c4a;--muted:#647784;--accent:#087f68;--paper:#f9fbfc}*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;color:var(--ink);background:var(--paper)}
.lesson{border:1px solid #dce5e9;border-radius:18px;padding:20px;background:linear-gradient(145deg,#fff,#f4f8fa)}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent)}.count{font-size:12px;color:var(--muted)}h3{font:600 22px Georgia,serif;margin:7px 0 0}.canvas{width:100%;height:205px;display:block}.narration{min-height:52px;line-height:1.6;font-size:15px;margin:2px 0 15px;padding:12px 15px;background:#eaf1f4;border-radius:10px}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:7px}button,select{font:600 12px system-ui;padding:8px 12px;border:1px solid #d0dce1;border-radius:7px;background:white;color:var(--ink);cursor:pointer}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #edb75e;outline-offset:2px}button:disabled{opacity:.4;cursor:default}.slider{width:100%;margin-top:12px;accent-color:var(--accent)}details{margin-top:10px;font-size:13px;line-height:1.5}summary{cursor:pointer;font-weight:600}.states{margin:8px 0}.states dt{font-weight:700}.states dd{margin:0 0 6px}.hint{font-size:11px;color:var(--muted);margin:8px 0 0}.node{animation:arrive .4s ease-out}.flow{stroke-dasharray:6 7;animation:travel 1.8s linear infinite}.highlight{filter:drop-shadow(0 4px 5px #aab9bd)}@keyframes travel{to{stroke-dashoffset:-52}}@keyframes arrive{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.flow,.node{animation:none}}@media(max-width:540px){.lesson{padding:12px}.canvas{height:190px}h3{font-size:19px}.narration{font-size:13px}.controls{gap:5px}button{padding:8px}.hint{font-size:10px}}
</style></head><body><main class="lesson" aria-label="Guided concept animation"><div class="top"><span class="eyebrow">Watch · predict · understand</span><span class="count" id="counter"></span></div><h3 id="title"></h3><svg class="canvas" id="scene" viewBox="0 0 780 205" role="img"></svg><p class="narration" id="narration" aria-live="polite"></p><div class="controls"><button id="previous" aria-label="Previous step">← Back</button><button class="primary" id="play">Play</button><button id="next" aria-label="Next step">Next →</button><button id="restart">Restart</button><label for="speed">Pace</label><select id="speed"><option value="3500">Slow</option><option value="2200" selected>Normal</option><option value="1200">Fast</option></select></div><input id="position" class="slider" type="range" min="0" value="0" aria-label="Animation step"><details><summary>Read the current state as text</summary><dl id="states" class="states"></dl></details><p class="hint">Illustrative sequence. Pause to predict the next step. Arrow keys move through steps. Motion follows your system preference.</p></main>
<script>
const lesson=__PAYLOAD__;document.documentElement.style.setProperty('--accent',lesson.accent);const frames=lesson.animation.frames;let at=0,timer=null;
const $=id=>document.getElementById(id);$('title').textContent=lesson.title;$('position').max=frames.length-1;
function el(tag,attrs={},text){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,String(v));if(text!==undefined)n.textContent=text;return n}
function wrap(svg,text,x,y,width=23,size=15,weight=500,color='#213c4a'){const words=String(text).split(' ');let lines=[''];for(const word of words){if((lines[lines.length-1]+' '+word).trim().length>width)lines.push(word);else lines[lines.length-1]=(lines[lines.length-1]+' '+word).trim()}lines.slice(0,3).forEach((line,j)=>svg.append(el('text',{x,y:y+j*(size+6),'font-size':size,'font-family':'system-ui,sans-serif','font-weight':weight,fill:color,'text-anchor':'middle'},line)))}
function draw(){const f=frames[at],svg=$('scene');svg.replaceChildren();svg.setAttribute('aria-label',f.narration);const count=f.nodes.length,small=window.innerWidth<540,step=750/count,w=small?330:step-18,scene=lesson.animation.scene;svg.setAttribute('viewBox',small?`0 0 360 ${count*130+20}`:'0 0 780 205');svg.style.height=(small?count*130+20:205)+'px';
const defs=el('defs');const marker=el('marker',{id:'arrow',markerWidth:8,markerHeight:8,refX:7,refY:4,orient:'auto'});marker.append(el('path',{d:'M0 0 L8 4 L0 8 Z',fill:lesson.accent}));defs.append(marker);svg.append(defs);
f.nodes.forEach((node,i)=>{let x=small?15:15+i*step,y=small?10+i*130:40,h=small?114:126;if(scene==='trace'&&!small){y=20+i*18;h=100}if(scene==='timeline'&&!small)y=45;
if(small&&i<count-1){svg.append(el('path',{d:`M180 ${y+h} L180 ${y+127}`,fill:'none',stroke:lesson.accent,'stroke-width':2,'marker-end':'url(#arrow)',class:'flow'}))}
if(!small&&i<count-1 && !['memory','buckets','parallel','scheduler','rack','dual'].includes(scene)){svg.append(el('path',{d:`M${x+w} ${y+h/2} L${x+step-5} ${y+h/2}`,fill:'none',stroke:lesson.accent,'stroke-width':2,'marker-end':'url(#arrow)',class:'flow'}))}
const g=el('g',{class:'node'+(i===f.highlight?' highlight':'')});g.append(el('rect',{x,y,width:w,height:h,rx:scene==='rack'?8:14,fill:i===f.highlight?'#e1f1ed':'#fff',stroke:i===f.highlight?lesson.accent:'#d8e3e8','stroke-width':i===f.highlight?2:1}));
if(scene==='rack'){for(let r=0;r<3;r++)g.append(el('rect',{x:x+12,y:y+10+r*7,width:30,height:3,rx:1,fill:'#b4c8cb'}));g.append(el('circle',{cx:x+w-18,cy:y+19,r:4,fill:lesson.accent}))}
if(scene==='memory'||scene==='buckets'){for(let b=0;b<8;b++)g.append(el('rect',{x:x+13+b*(w-26)/8,y:y+h-20,width:(w-30)/8,height:8,rx:2,fill:b<=at*2?'#8cc7b5':'#e6edef'}))}
if(scene==='parallel'||scene==='scheduler'){for(let b=0;b<8;b++)g.append(el('rect',{x:x+12+(b%4)*17,y:y+h-30+Math.floor(b/4)*10,width:12,height:6,rx:2,fill:b<Math.min(8,(at+1)*2)?lesson.accent:'#dce8e8'}))}
wrap(g,node.label,x+w/2,y+35,Math.max(15,Math.floor(w/9)),14,700);wrap(g,node.value,x+w/2,y+72,Math.max(15,Math.floor(w/8)),15,500,i===f.highlight?lesson.accent:'#506a78');svg.append(g)});
const transcript=$('states');transcript.replaceChildren();f.nodes.forEach(n=>{const label=document.createElement('dt'),value=document.createElement('dd');label.textContent=n.label;value.textContent=n.value;transcript.append(label,value)});$('counter').textContent=`Step ${at+1} of ${frames.length}`;$('narration').textContent=f.narration;$('position').value=at;$('previous').disabled=at===0;$('next').disabled=at===frames.length-1}
function pause(){if(timer)clearInterval(timer);timer=null;$('play').textContent='Play'}function advance(){if(at>=frames.length-1){pause();return}at++;draw();if(at===frames.length-1)pause()}
$('play').onclick=()=>{if(timer){pause();return}if(at===frames.length-1)at=0;draw();$('play').textContent='Pause';timer=setInterval(advance,Number($('speed').value))};$('previous').onclick=()=>{pause();at=Math.max(0,at-1);draw()};$('next').onclick=()=>{pause();advance()};$('restart').onclick=()=>{pause();at=0;draw()};$('position').oninput=()=>{pause();at=Number($('position').value);draw()};$('speed').onchange=pause;document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('previous').click()});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('resize',draw);draw();
</script></body></html>
